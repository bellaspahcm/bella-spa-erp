name: Baseline Artifact Collector

# This workflow collects diagnostic artifacts for baseline generation
# Output: Machine-readable JSON files for TypeScript, ESLint, Jest, Migration checks

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to collect artifacts from'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect:
    name: Collect Baseline Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout SHA
        id: verify_sha
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          
          echo "Requested SHA: $REQUESTED_SHA"
          echo "Actual SHA:    $ACTUAL_SHA"
          
          if [ "$REQUESTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "❌ ERROR: SHA mismatch"
            echo "   Requested: $REQUESTED_SHA"
            echo "   Checked out: $ACTUAL_SHA"
            exit 1
          fi
          
          echo "✅ SHA verified: $ACTUAL_SHA"
          echo "actual_sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect diagnostic artifacts with canonical producer
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npx tsx scripts/ci/baseline/collect-artifacts.ts --out-dir ./artifacts

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
        with:
          name: baseline-artifacts-${{ inputs.commit_sha || github.sha }}
          path: artifacts/**
          retention-days: 90
          if-no-files-found: warn

      - name: Display artifact info
        env:
          COMMIT_SHA: ${{ steps.verify_sha.outputs.actual_sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "✅ Baseline artifacts collected"
          echo ""
          echo "Commit: $COMMIT_SHA"
          echo "Branch: $BRANCH"
          echo "Provenance verified: ✅"
          echo ""
          echo "File sizes:"
          ls -lh artifacts/* 2>/dev/null || true
          echo ""
          echo "Download artifacts from:"
          echo "https://github.com/$REPO/actions/runs/$RUN_ID"
