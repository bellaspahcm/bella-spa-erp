name: Quality and Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Check if TypeScript/JavaScript files changed
        id: check-lint-needed
        run: |
          # Get changed files
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" || true
            CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          
          # Check if any TS/JS files changed (exclude scripts/, .github/)
          if echo "$CHANGED_FILES" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' | grep -vE '^(scripts/|\.github/)' | grep -q '.'; then
            echo "needs_lint=true" >> $GITHUB_OUTPUT
            echo "✅ Found application TS/JS files to lint"
          else
            echo "needs_lint=false" >> $GITHUB_OUTPUT
            echo "⏭️  No application code changed, skipping lint"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src/app/api/|docs/guides/api-reference\.md|docs/technical/api-versioning-policy\.md|docs/api-reference\.md|docs/api-versioning-policy\.md|scripts/check-api-docs\.mjs|scripts/check-api-versioning\.mjs)'; then
            echo "needs_api_docs=true" >> $GITHUB_OUTPUT
            echo "✅ Found API surface or API documentation files to verify"
          else
            echo "needs_api_docs=false" >> $GITHUB_OUTPUT
            echo "⏭️  No API surface or API documentation changes, skipping API docs checks"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src/|supabase/|database/|migrations/|prisma/migrations/|package\.json|package-lock\.json|scripts/check-supabase-|scripts/check-business-invariants\.cjs|.*\.sql$)'; then
            echo "needs_db_checks=true" >> $GITHUB_OUTPUT
            echo "✅ Found database, application, or DB-check files to verify"
          else
            echo "needs_db_checks=false" >> $GITHUB_OUTPUT
            echo "⏭️  No database, application, or DB-check changes, skipping live DB checks"
          fi

      - name: Required CI environment config
        run: npm run ci:env:check

      - name: Lint
        if: steps.check-lint-needed.outputs.needs_lint == 'true'
        run: npm run lint
      
      - name: Lint skipped (infrastructure-only PR)
        if: steps.check-lint-needed.outputs.needs_lint == 'false'
        run: echo "✅ Lint skipped - infrastructure-only PR"

      - name: API documentation coverage
        if: steps.check-lint-needed.outputs.needs_api_docs == 'true'
        run: npm run docs:api:check

      - name: API versioning policy
        if: steps.check-lint-needed.outputs.needs_api_docs == 'true'
        run: npm run docs:api:versioning

      - name: API documentation checks skipped
        if: steps.check-lint-needed.outputs.needs_api_docs == 'false'
        run: echo "✅ API docs checks skipped - no API surface or API documentation changes"

      - name: Supabase migration drift check
        if: steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:migration:check

      - name: Supabase RPC grant policy
        if: steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:rpc-grants:check

      - name: Supabase data access smoke
        if: steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:access:check

      - name: Supabase live RPC smoke
        if: steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:rpc-smoke:check

      - name: Business data invariant guard
        if: steps.check-lint-needed.outputs.needs_db_checks == 'true'
        run: npm run db:business:check

      - name: Live DB checks skipped
        if: steps.check-lint-needed.outputs.needs_db_checks == 'false'
        run: echo "✅ Live DB checks skipped - no database, application, or DB-check changes"

      - name: Production build
        run: npm run build

      - name: Critical regression tests
        run: npm run test:critical

      - name: Export actions regression tests
        run: npm test -- src/__tests__/export-actions.test.ts --runInBand

      - name: Dependency audit
        run: npm run security:audit

      - name: Secret and log leak guard
        run: npm run security:secrets

      - name: Log redaction tests
        run: npm test -- src/__tests__/log-redactor.test.ts --runInBand

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated route smoke
        timeout-minutes: 8
        run: npm run e2e:auth-smoke
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Beauty operational UAT smoke
        timeout-minutes: 12
        run: npm run e2e:beauty-uat
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Responsive visual smoke
        timeout-minutes: 35
        run: npm run e2e:visual
        env:
          E2E_VISUAL_SMOKE_SCOPE: core
          E2E_VISUAL_EXPECTED_TESTS: "30"
          E2E_NAVIGATION_TIMEOUT_MS: "60000"
          E2E_NEXT_DEV_BUNDLER: "webpack"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Assert responsive visual smoke results
        run: npm run e2e:visual:assert
        env:
          E2E_VISUAL_EXPECTED_TESTS: "30"

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: responsive-visual-smoke-artifacts
          path: |
            playwright-report
            playwright-results.json
            test-results
          if-no-files-found: ignore
