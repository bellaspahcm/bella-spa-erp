name: Quality and Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: API documentation coverage
        run: npm run docs:api:check

      - name: API versioning policy
        run: npm run docs:api:versioning

      - name: Supabase migration drift check
        run: npm run db:migration:check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_MIGRATION_CHECK_OPTIONAL: "1"

      - name: Supabase RPC grant policy
        run: npm run db:rpc-grants:check

      - name: Supabase data access smoke
        run: npm run db:access:check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_ACCESS_CHECK_OPTIONAL: "1"

      - name: Supabase live RPC smoke
        run: npm run db:rpc-smoke:check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_RPC_SMOKE_OPTIONAL: "1"

      - name: Production build
        run: npm run build

      - name: Critical regression tests
        run: npm run test:critical

      - name: Export actions regression tests
        run: npm test -- src/__tests__/export-actions.test.ts --runInBand

      - name: Dependency audit
        run: npm run security:audit

      - name: Secret and log leak guard
        run: npm run security:secrets

      - name: Log redaction tests
        run: npm test -- src/__tests__/log-redactor.test.ts --runInBand

      - name: Install Playwright Chromium
        if: ${{ vars.RUN_VISUAL_SMOKE == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Responsive visual smoke
        if: ${{ vars.RUN_VISUAL_SMOKE == 'true' }}
        run: npm run e2e:visual
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: ${{ always() && vars.RUN_VISUAL_SMOKE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
