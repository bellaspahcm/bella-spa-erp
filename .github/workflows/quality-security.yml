name: Quality and Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: API documentation coverage
        run: npm run docs:api:check

      - name: API versioning policy
        run: npm run docs:api:versioning

      - name: Production build
        run: npm run build

      - name: Critical regression tests
        run: npm run test:critical

      - name: Export actions regression tests
        run: npm test -- src/__tests__/export-actions.test.ts --runInBand

      - name: Dependency audit
        run: npm run security:audit

      - name: Secret and log leak guard
        run: npm run security:secrets

      - name: Log redaction tests
        run: npm test -- src/__tests__/log-redactor.test.ts --runInBand

      - name: Install Playwright Chromium
        if: ${{ vars.RUN_VISUAL_SMOKE == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Responsive visual smoke
        if: ${{ vars.RUN_VISUAL_SMOKE == 'true' }}
        run: npm run e2e:visual
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: ${{ always() && vars.RUN_VISUAL_SMOKE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
