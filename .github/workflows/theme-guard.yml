name: Theme Architecture Guard

on:
  pull_request:
    paths:
      - 'src/app/globals.css'
      - 'src/styles/**/*.css'
      - 'src/components/**/*.tsx'
      - 'src/components/**/*.jsx'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/app/globals.css'
      - 'src/styles/**/*.css'
      - 'src/components/**/*.tsx'

jobs:
  theme-guard:
    name: Check Theme Architecture
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Theme Architecture Guard (No-New-Debt)
        id: theme-guard
        run: |
          echo "🎨 Running Theme Architecture Guard (No-New-Debt Mode)..."
          npm run theme:guard:diff
      
      - name: Comment PR on improvement
        if: github.event_name == 'pull_request' && steps.theme-guard.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if improvement (exit code 2)
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Theme Architecture Guard: PASS

**No new violations introduced!**

Current violations match or improved baseline.

**Baseline:** 108 BLOCK, 12 WARN  
**Target:** 0 BLOCK, 0 WARN

See [Progress Report](../blob/main/docs/architecture/THEME_GUARD_PROGRESS_REPORT.md) for remaining work.
`
            })
      
      - name: Comment PR on new debt
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Theme Architecture Guard: BLOCKED

**New violations introduced or existing count increased!**

This PR adds new technical debt to the theme architecture.

**Required Action:**
1. Run \`npm run theme:guard\` locally to see violations
2. Fix new violations following [Fix Guidelines](../blob/main/scripts/architecture/THEME_GUARD_README.md)
3. If increase is justified, document reason and run \`npm run theme:guard:update-baseline\`

**Current Baseline:** 108 BLOCK, 12 WARN  
**No-New-Debt Policy:** Existing debt allowed, new debt blocked
`
            })
      
      - name: Set final status
        run: |
          echo "✅ Theme Guard enforcing no-new-debt policy"
          echo "Baseline violations: 108 BLOCK, 12 WARN (legacy debt allowed)"
          echo "New violations: BLOCKED"
