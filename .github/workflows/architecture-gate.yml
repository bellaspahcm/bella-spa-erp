name: Architecture Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  frozen-files:
    name: Frozen File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Need full history for diff
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for frozen file modifications
        run: node scripts/architecture/ci-frozen-check.js

  guard:
    name: Architecture Guard Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify Architecture Guard integrity
        run: node scripts/architecture/ci-guard-integrity.js
      
      - name: Run Architecture Guard
        run: npm run arch:guard

  dependency:
    name: Dependency Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check dependency boundaries
        run: node scripts/architecture/ci-dependency-check.js

  regression:
    name: Logistics Kernel Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Logistics kernel tests
        run: npm run logistics:verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
