name: Static Analysis Security Suite

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Check if application code changed
        id: check-code
        run: |
          # Get changed files
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" || true
            CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          
          # Check if any files remain after excluding infrastructure paths
          NON_INFRA_FILES=$(echo "$CHANGED_FILES" | grep -vE '^(\.github/|docs/|scripts/|\.eslintignore$|\.trivyignore$)' | grep '.' || echo "")
          
          if [ -n "$NON_INFRA_FILES" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found application code to scan"
            echo "Files: $NON_INFRA_FILES"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Infrastructure-only PR, reducing Semgrep scope"
            echo "All changed files are infrastructure: .github/, docs/, scripts/"
          fi

      - name: Run Semgrep CE
        id: semgrep
        if: steps.check-code.outputs.has_code == 'true'
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif --error
        continue-on-error: true
      
      - name: Run Semgrep CE (infrastructure scope)
        id: semgrep-infra
        if: steps.check-code.outputs.has_code == 'false'
        run: |
          echo "✅ Infrastructure-only PR detected"
          echo "Running Semgrep with CI/secrets rules only (not full --config auto)"
          
          # Run with limited ruleset for infrastructure files
          semgrep scan \
            --config "p/ci" \
            --config "p/secrets" \
            --sarif \
            --output semgrep-results.sarif \
            --no-git-ignore \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'test-results' || EXIT_CODE=$?
          
          # Allow findings for infrastructure (they're for review, not block)
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ]; then
            echo "⚠️  Semgrep found issues in infrastructure files (for review)"
            echo "Infrastructure PRs do not block on Semgrep findings"
            exit 0
          fi
          
          echo "✅ Semgrep infrastructure scan completed"
        continue-on-error: false

      - name: Upload Semgrep SARIF
        if: ${{ always() && hashFiles('semgrep-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Archive Semgrep SARIF
        if: ${{ always() && hashFiles('semgrep-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 14

      - name: Fail on Semgrep findings
        if: ${{ steps.semgrep.outcome == 'failure' && steps.check-code.outputs.has_code == 'true' }}
        run: exit 1
      
      - name: Semgrep infrastructure scan completed
        if: ${{ steps.check-code.outputs.has_code == 'false' }}
        run: echo "✅ Semgrep infrastructure scan completed (workflow security only)"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Check if dependency files changed
        id: check-deps
        run: |
          # Get changed files
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            CHANGED_FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          
          # Trivy dependency/container scan is scoped to dependency and container
          # inputs. Test-only source changes are covered by test jobs and Gitleaks.
          if echo "$CHANGED_FILES" | grep -qE '(^|/)package\.json$|(^|/)package-lock\.json$|(^|/)Dockerfile$|(^|/)\.dockerignore$|^\.trivyignore$'; then
            echo "has_deps=true" >> $GITHUB_OUTPUT
            echo "✅ Found dependency/container files to scan"
          else
            echo "has_deps=false" >> $GITHUB_OUTPUT
            echo "⏭️  No dependency/container files changed, skipping Trivy scan"
          fi

      - name: Run Trivy filesystem scan
        if: steps.check-deps.outputs.has_deps == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: node_modules,mcp-server/node_modules,.next,test-results
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Archive Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Gate fixable high and critical vulnerabilities
        if: steps.check-deps.outputs.has_deps == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: node_modules,mcp-server/node_modules,.next,test-results
          exit-code: "1"
      
      - name: Trivy skipped (infrastructure-only PR)
        if: steps.check-deps.outputs.has_deps == 'false'
        run: echo "✅ Trivy filesystem scan skipped - no dependency files changed"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube skipped
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "Configure SONAR_TOKEN and SONAR_HOST_URL to enable SonarQube scanning."

      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
