name: Hospitality Production UI Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospitality-production-ui-smoke
  cancel-in-progress: false

jobs:
  hospitality-production-smoke:
    name: Read-only authenticated Hospitality UI smoke
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: https://bella-spa-erp.vercel.app
      PRODUCTION_E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL }}
      PRODUCTION_E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD }}
      HOSPITALITY_PRODUCTION_SMOKE_ARTIFACT_DIR: artifacts/hospitality-production-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate smoke environment
        run: |
          missing=0
          for name in E2E_BASE_URL PRODUCTION_E2E_ADMIN_EMAIL PRODUCTION_E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for authenticated production smoke"
              missing=1
            fi
          done
          if [ "$E2E_BASE_URL" != "https://bella-spa-erp.vercel.app" ]; then
            echo "::error::E2E_BASE_URL must target production for this smoke"
            missing=1
          fi
          exit "$missing"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only Hospitality production smoke
        run: npm run e2e:hospitality-production-smoke

      - name: Upload Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hospitality-production-ui-smoke-artifacts
          path: |
            playwright-results.json
            artifacts/hospitality-production-smoke
          if-no-files-found: ignore
          retention-days: 7
