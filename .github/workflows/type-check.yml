name: Type Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect_changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      scope_status: ${{ steps.scope.outputs.scope_status }}
      scope_level: ${{ steps.scope.outputs.scope_level }}
      products: ${{ steps.scope.outputs.products }}
      os: ${{ steps.scope.outputs.os }}
      affected_products: ${{ steps.scope.outputs.affected_products }}
      needs_typecheck: ${{ steps.scope.outputs.needs_typecheck }}
      typecheck_mode: ${{ steps.scope.outputs.typecheck_mode }}
      scope_message: ${{ steps.scope.outputs.scope_message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Classify scope
        id: scope
        run: node scripts/ci-scope-router.mjs --fail-on-block

  typecheck:
    name: Type Check (${{ needs.detect_changes.outputs.typecheck_mode }})
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_SCOPE_TYPECHECK_MODE: ${{ needs.detect_changes.outputs.typecheck_mode }}
      CI_SCOPE_PRODUCTS: ${{ needs.detect_changes.outputs.products }}
      CI_SCOPE_OS: ${{ needs.detect_changes.outputs.os }}
      CI_SCOPE_AFFECTED_PRODUCTS: ${{ needs.detect_changes.outputs.affected_products }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Restore TypeScript cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/tsbuildinfo
            .next/cache
          key: ${{ runner.os }}-ts-next-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'next.config.*') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ts-next-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'next.config.*') }}-
            ${{ runner.os }}-ts-next-

      - run: npm ci

      - name: Run dependency-aware typecheck
        run: npm run typecheck:${{ needs.detect_changes.outputs.typecheck_mode }}

  skipped:
    name: Type Check Skipped
    needs: detect_changes
    if: needs.detect_changes.outputs.needs_typecheck != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Typecheck skipped by dependency-aware CI: ${{ needs.detect_changes.outputs.scope_message }}"
