name: Validate PR Scope

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-scope:
    runs-on: ubuntu-latest
    name: Validate PR Scope

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Analyze PR scope
        id: analyze
        run: node scripts/ci-scope-router.mjs

      - name: Post comment
        if: steps.analyze.outputs.scope_message
        uses: actions/github-script@v7
        env:
          SCOPE_STATUS: ${{ steps.analyze.outputs.scope_status }}
          SCOPE_MESSAGE: ${{ steps.analyze.outputs.scope_message }}
          SCOPE_LEVEL: ${{ steps.analyze.outputs.scope_level }}
          SCOPE_PRODUCTS: ${{ steps.analyze.outputs.products }}
          SCOPE_OS: ${{ steps.analyze.outputs.os }}
          AFFECTED_PRODUCTS: ${{ steps.analyze.outputs.affected_products }}
          TYPECHECK_MODE: ${{ steps.analyze.outputs.typecheck_mode }}
        with:
          script: |
            const body = [
              '## Git Workflow Constitution - Scope Validation',
              '',
              `**${process.env.SCOPE_STATUS}**`,
              '',
              process.env.SCOPE_MESSAGE,
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| Scope | ${process.env.SCOPE_LEVEL || 'n/a'} |`,
              `| Products | ${process.env.SCOPE_PRODUCTS || 'none'} |`,
              `| OS | ${process.env.SCOPE_OS || 'none'} |`,
              `| Affected products | ${process.env.AFFECTED_PRODUCTS || 'none'} |`,
              `| Typecheck tier | ${process.env.TYPECHECK_MODE || 'skip'} |`,
              '',
              '---',
              '*Enforced by dependency-aware CI routing.*',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes('Git Workflow Constitution - Scope Validation')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

      - name: Set check conclusion
        run: |
          if [ "${{ steps.analyze.outputs.scope_status }}" = "BLOCK" ]; then
            echo "PR BLOCKED: multi-product product-only contamination detected"
            exit 1
          fi
          echo "PR ALLOWED: scope validation passed"
