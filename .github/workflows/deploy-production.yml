name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || vars.E2E_BASE_URL || 'https://bella-spa-erp.vercel.app' }}

jobs:
  validate:
    name: Validate Main Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require immutable deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$PRODUCTION_SUPABASE_DB_URL"
          test -n "$BYPASS_SECRET"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"
      - run: npm run lint
      - run: npm run test:critical
      - run: npm run security:audit
      - run: npm run security:secrets
      - run: npm run docs:api:versioning
      - run: npm run db:migration:zero-downtime -- --base HEAD^
      - run: npm run db:migration:check
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  preview:
    name: Build Immutable Preview
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
      BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy exact build without promotion
        id: deploy
        run: |
          output="$(npx vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          printf '%s\n' "$output"
          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1)"
          printf '%s' "$deployment_url" | grep -Eq '^https://[^/]+\.vercel\.app$'
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Wait for exact preview health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header "x-vercel-protection-bypass: $BYPASS_SECRET" "$DEPLOYMENT_URL/api/health" || true)"
            if [ "$status" = 200 ]; then
              exit 0
            fi
            echo "Preview health attempt $attempt returned HTTP $status"
            sleep 15
          done
          exit 1

  smoke:
    name: Smoke Exact Preview
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:auth-smoke
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.deployment_url }}
          E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

  promote:
    name: Promote Verified Preview
    needs: [preview, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_BASE_URL || vars.E2E_BASE_URL || 'https://bella-spa-erp.vercel.app' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ needs.preview.outputs.deployment_url }}
    steps:
      - run: npx vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

  verify:
    name: Verify Promoted Release
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sample production health
        run: |
          for sample in 1 2 3; do
            curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/health" > /dev/null
            sleep 20
          done
