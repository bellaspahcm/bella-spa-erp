name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || vars.E2E_BASE_URL || 'https://bella-spa-erp.vercel.app' }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:critical
      - run: npm run security:audit
      - run: npm run security:secrets
      - run: npm run docs:api:versioning
      - run: npm run db:migration:zero-downtime
      - run: npm run db:migration:check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy Approved Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_BASE_URL || vars.E2E_BASE_URL || 'https://bella-spa-erp.vercel.app' }}
    steps:
      - name: Require deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: test -n "$VERCEL_DEPLOY_HOOK_URL"
      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"job"'
      - name: Wait for a healthy release
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_BASE_URL/api/health")"
            if [ "$status" = 200 ]; then
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $status"
            sleep 15
          done
          exit 1

  smoke:
    name: Production Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:auth-smoke
        env:
          E2E_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.PRODUCTION_E2E_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_E2E_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-playwright-report
          path: playwright-report/
          retention-days: 14

  verify:
    name: Post-Deployment Verification
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sample production health
        run: |
          for sample in 1 2 3; do
            curl --fail --silent --show-error "$PRODUCTION_BASE_URL/api/health" > /dev/null
            sleep 20
          done
