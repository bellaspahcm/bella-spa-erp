name: Mobile CI

on:
  push:
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'scripts/audit-rls-security.ts'
      - 'scripts/check-secret-leaks.mjs'
  pull_request:
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'scripts/audit-rls-security.ts'
      - 'scripts/check-secret-leaks.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Shared package typecheck
        run: npm run shared:typecheck

      - name: Install mobile dependencies
        run: npm install --prefix apps/mobile --no-package-lock --ignore-scripts

      - name: Mobile typecheck
        run: npx tsc -p apps/mobile/tsconfig.json --noEmit

      - name: Web build (regression check)
        run: npm run build

      - name: Secret leak check
        run: npm run security:secrets
