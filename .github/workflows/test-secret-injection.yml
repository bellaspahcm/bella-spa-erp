name: Test Secret Injection (Phase 4A Verification)

# Purpose: Verify GitHub Environment Secrets are injected correctly at runtime
# Safety: Manual trigger only, no production deployment, no database connections
# Phase: P0.3 Phase 4A - Secret Migration & Runtime Injection Verification

on:
  workflow_dispatch:  # Manual trigger only (safe, no auto-deploy)

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    environment: Production  # Required to access Production environment secrets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify DATABASE_EXECUTOR_URL exists
        env:
          DATABASE_EXECUTOR_URL: ${{ secrets.DATABASE_EXECUTOR_URL }}
        run: |
          if [ -z "$DATABASE_EXECUTOR_URL" ]; then
            echo "❌ ERROR: DATABASE_EXECUTOR_URL not set"
            exit 1
          fi
          echo "✅ DATABASE_EXECUTOR_URL: PRESENT"
          echo "✅ Length: ${#DATABASE_EXECUTOR_URL} chars"
      
      - name: Verify GATE_SIGNING_KEY exists
        env:
          GATE_SIGNING_KEY: ${{ secrets.GATE_SIGNING_KEY }}
        run: |
          if [ -z "$GATE_SIGNING_KEY" ]; then
            echo "❌ ERROR: GATE_SIGNING_KEY not set"
            exit 1
          fi
          echo "✅ GATE_SIGNING_KEY: PRESENT"
          echo "✅ Length: ${#GATE_SIGNING_KEY} chars"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test runtime injection to Node.js script
        env:
          DATABASE_EXECUTOR_URL: ${{ secrets.DATABASE_EXECUTOR_URL }}
          GATE_SIGNING_KEY: ${{ secrets.GATE_SIGNING_KEY }}
        run: |
          node -e "
            const dbUrl = process.env.DATABASE_EXECUTOR_URL;
            const gateKey = process.env.GATE_SIGNING_KEY;
            
            console.log('✅ process.env.DATABASE_EXECUTOR_URL: PRESENT');
            console.log('✅ process.env.GATE_SIGNING_KEY: PRESENT');
            
            if (!dbUrl || !gateKey) {
              console.error('❌ ERROR: Secrets not accessible in Node.js process.env');
              process.exit(1);
            }
            
            console.log('✅ PASS: Runtime injection successful');
            console.log('✅ PASS: Secret values NOT displayed');
          "
      
      - name: Summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "PHASE 4A SECRET INJECTION VERIFICATION"
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ DATABASE_EXECUTOR_URL: PRESENT"
          echo "✅ GATE_SIGNING_KEY: PRESENT"
          echo "✅ Runtime injection: WORKING"
          echo "✅ process.env resolution: WORKING"
          echo "✅ Secret values: NOT DISPLAYED"
          echo ""
          echo "🟢 PHASE 4A VERIFICATION: PASS"
          echo "🟢 Ready for Phase 4B (Build Control Plane)"
          echo "═══════════════════════════════════════════════════════════"

  test-bdgf-injection:
    runs-on: ubuntu-latest
    environment: Production
    needs: verify-secrets  # Run after secret verification passes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test BDGF script environment (process.env access)
        env:
          DATABASE_EXECUTOR_URL: ${{ secrets.DATABASE_EXECUTOR_URL }}
          GATE_SIGNING_KEY: ${{ secrets.GATE_SIGNING_KEY }}
        run: |
          node -e "
            // Simulate BDGF script environment
            const dbUrl = process.env.DATABASE_EXECUTOR_URL;
            const gateKey = process.env.GATE_SIGNING_KEY;
            
            console.log('📋 BDGF Script Environment Check');
            console.log('═══════════════════════════════════');
            console.log('DATABASE_EXECUTOR_URL: PRESENT');
            console.log('DATABASE_EXECUTOR_URL format: VALID');
            console.log('GATE_SIGNING_KEY: PRESENT');
            console.log('GATE_SIGNING_KEY length: VALID');
            console.log('═══════════════════════════════════');
            
            if (!dbUrl || !dbUrl.startsWith('postgresql://')) {
              console.error('❌ Invalid DATABASE_EXECUTOR_URL format');
              process.exit(1);
            }
            
            if (!gateKey || gateKey.length < 64) {
              console.error('❌ Invalid GATE_SIGNING_KEY (must be >= 64 chars)');
              process.exit(1);
            }
            
            console.log('✅ PASS: BDGF environment injection successful');
            console.log('✅ PASS: Secret values NOT displayed');
          "
      
      - name: Verify no .env file required in CI
        run: |
          if [ -f .env ]; then
            echo "⚠️  WARNING: .env file exists in CI (should not be committed)"
            echo "   Secrets should come from GitHub Environment only"
            exit 1
          fi
          echo "✅ PASS: No .env file in CI (secrets from GitHub only)"
      
      - name: Final summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "PHASE 4A: BDGF INJECTION TEST"
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ DATABASE_EXECUTOR_URL: PRESENT"
          echo "✅ GATE_SIGNING_KEY: PRESENT"
          echo "✅ Runtime injection: PASS"
          echo "✅ BDGF environment injection: PASS"
          echo "✅ Secret leakage: NONE"
          echo "✅ Production DB connection: NOT ATTEMPTED"
          echo "✅ No .env file required in CI"
          echo ""
          echo "🟢 PHASE 4A COMPLETE: Secret boundary verified"
          echo "🟢 Zero-knowledge deployment principle: ENFORCED"
          echo "═══════════════════════════════════════════════════════════"
