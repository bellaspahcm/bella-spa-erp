# Prometheus Configuration
# Phase 8: Optimization & Production Readiness

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  scrape_timeout: 10s

  external_labels:
    cluster: 'bella-spa-erp'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alerting rules
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Intelligence Layer Application Metrics
  - job_name: 'intelligence-layer'
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - 'localhost:3000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bella-spa-app'

  # PostgreSQL Database Metrics (using postgres_exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    relabel_configs:
      - source_labels: [__address__]
        target_label: database
        replacement: 'bella-spa-db'

  # Node Exporter (System metrics)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
