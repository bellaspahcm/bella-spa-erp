### Bypass Pattern Identified
primitive_bypassed: Person Center
evidence: |
  - Real Estate uses TEXT field for identity
  - No FK to persons/party_parties
  - No contact info, roles, lifecycle for owner
  - No deduplication (same name multiple times?)
  - No tenant isolation for owner entity
  - Bypass = Direct TEXT instead of Person/Party relationship

### Migration Target Confirmed
from: "real_estate_products.owner_name (TEXT)"
to: "Person Center (persons + party_roles)"
relationship_model: |
  owner_name (TEXT)
    ↓
  persons (Person entity)
    ↓
  party_parties (Party wrapper)
    ↓
  party_roles (real_estate vertical, investor role)
    ↓
  real_estate_products.customer_id (FK to party_parties)

justification: |
  1. owner_name is actual identity (not label)
  2. 1:N relationship exists (verified)
  3. 97.6% usage (active business need)
  4. Bypasses Person Center primitive
  5. Architecture requires: deduplication, contact, roles

## Migration Scope (Phase 1)

### Tables Affected
primary: real_estate_products
columns_to_add:
  - customer_id: UUID REFERENCES party_parties(id)
columns_to_deprecate:
  - owner_name: TEXT (keep for dual-read, deprecate after validation)

### Data Migration Estimate
unique_owners: 6
products_to_migrate: 41
estimated_effort: "40-60 hours"
complexity: MEDIUM
reasons:
  - Need to create Person for each unique owner
  - Need to create Party wrapper
  - Need to create Party Role (real_estate vertical)
  - Need to handle placeholders ("Chưa có chủ sở hữu")
  - Need to handle duplicates (deduplication)

